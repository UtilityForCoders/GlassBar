[package]
name = "glassbar"
version = "0.13.0"
edition = "2021"
license = "MIT"
description = "Barra de tareas moderna estilo Liquid Glass para Windows, ultraligera en Rust."

[dependencies]
# Rasterizador 2D en Rust puro (anti-aliasing, gradientes, curvas).
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vectores de Windows.UI.Composition (el fondo desenfocado del dock).
windows-numerics = "0.3"
unicode-normalization = "0.1"
# Lectura de fuentes TrueType (las letras se rasterizan en `font`).
skrifa = "0.50"

[dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth",
    "Devices_Enumeration",
    "Devices_Radios",
    "Foundation",
    "Foundation_Collections",
    "Win32_Devices_Display",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security_Cryptography",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Registry",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Accessibility",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "System",
    "System_Power",
    "UI",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Composition",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_SystemInformation",
]

# Avisos de clippy que aquí no ayudan. El resto se trata como error en el CI.
[lints.clippy]
# Las funciones de dibujo reciben posición, tamaño, color y escala por separado.
too_many_arguments = "allow"
# Los píxeles se recorren con `chunks_exact(4)`, que se lee mejor que `as_chunks`.
chunks_exact_to_as_chunks = "allow"
# Los literales agrupan por canal (AA_RR_GG_BB) o por campo, no de cuatro en cuatro.
unusual_byte_groupings = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
