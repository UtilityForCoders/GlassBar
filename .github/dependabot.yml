# Actualizaciones de dependencias contra develop, como cualquier otro cambio
# (Git Flow), con mensajes en Conventional Commits.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      windows:
        patterns: ["windows*"]
    # windows y windows-core tienen que ir en la misma versión (0.62 con 0.62):
    # una sin la otra no compila, y cada versión nueva cambia su API. Solo se
    # aceptan los parches (0.62.x); el salto de versión se hace a mano, a la vez.
    ignore:
      - dependency-name: "windows*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
